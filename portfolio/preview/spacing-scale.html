<!doctype html>
<html><head><meta charset="utf-8"><title>Card</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<style>html,body{margin:0;padding:0;background:var(--paper-1);}
.card{padding:22px 26px;display:flex;flex-direction:column;gap:10px;}
.row{display:flex;align-items:center;gap:14px;}
.box{background:var(--ink-3);height:22px;}
.name{font-family:var(--font-ui);font-size:10px;letter-spacing:.2em;color:var(--fg-muted);text-transform:uppercase;min-width:36px;}
.px{font-family:var(--font-ui);font-size:10px;color:var(--fg-subtle);margin-left:auto;}
</style></head>
<body><div class="card">
  <div class="row"><div class="name">1</div><div class="box" style="width:4px"></div><div class="px">4 px</div></div>
  <div class="row"><div class="name">2</div><div class="box" style="width:8px"></div><div class="px">8 px</div></div>
  <div class="row"><div class="name">3</div><div class="box" style="width:12px"></div><div class="px">12 px</div></div>
  <div class="row"><div class="name">4</div><div class="box" style="width:16px"></div><div class="px">16 px</div></div>
  <div class="row"><div class="name">5</div><div class="box" style="width:24px"></div><div class="px">24 px</div></div>
  <div class="row"><div class="name">6</div><div class="box" style="width:32px"></div><div class="px">32 px</div></div>
  <div class="row"><div class="name">7</div><div class="box" style="width:48px"></div><div class="px">48 px</div></div>
  <div class="row"><div class="name">8</div><div class="box" style="width:64px"></div><div class="px">64 px</div></div>
  <div class="row"><div class="name">9</div><div class="box" style="width:96px"></div><div class="px">96 px</div></div>
</div></body></html>
