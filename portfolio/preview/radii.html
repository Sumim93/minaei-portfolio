<!doctype html>
<html><head><meta charset="utf-8"><title>Card</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<style>html,body{margin:0;padding:0;background:var(--paper-1);}
.card{padding:28px;display:flex;gap:22px;align-items:center;}
.item{display:flex;flex-direction:column;align-items:center;gap:10px;}
.box{width:80px;height:60px;background:var(--ink-3);}
.n{font-family:var(--font-ui);font-size:10px;letter-spacing:.18em;color:var(--fg-muted);text-transform:uppercase;}
.v{font-family:var(--font-ui);font-size:10px;color:var(--fg-subtle);}
</style></head>
<body><div class="card">
  <div class="item"><div class="box" style="border-radius:0"></div><div class="n">none</div><div class="v">0</div></div>
  <div class="item"><div class="box" style="border-radius:2px"></div><div class="n">xs</div><div class="v">2 px</div></div>
  <div class="item"><div class="box" style="border-radius:4px"></div><div class="n">sm</div><div class="v">4 px</div></div>
  <div class="item"><div class="box" style="border-radius:6px"></div><div class="n">md · buttons</div><div class="v">6 px</div></div>
  <div class="item"><div class="box" style="border-radius:999px;width:110px"></div><div class="n">pill · chips</div><div class="v">999</div></div>
</div></body></html>
