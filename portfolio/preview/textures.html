<!doctype html>
<html><head><meta charset="utf-8"><title>Card</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@1,300&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<style>html,body{margin:0;padding:0;background:var(--paper-1);}
.card{padding:24px 26px;display:flex;gap:24px;align-items:center;}
.tex{width:120px;height:96px;background-size:cover;border:1px solid var(--border-soft);}
.n{font-family:var(--font-ui);font-size:10px;letter-spacing:.2em;color:var(--fg-muted);text-transform:uppercase;margin-top:8px;display:block;text-align:center;}
.col{display:flex;flex-direction:column;align-items:center;}
</style></head>
<body><div class="card">
  <div class="col"><div class="tex" style="background-image:url(../assets/textures/paper-warm.jpg)"></div><span class="n">paper-warm</span></div>
  <div class="col"><div class="tex" style="background-image:url(../assets/textures/canvas-light.jpg)"></div><span class="n">canvas-light</span></div>
  <div class="col"><div class="tex" style="background-image:url(../assets/textures/wash-moody.jpg)"></div><span class="n">wash-moody</span></div>
  <div style="flex:1;font-family:var(--font-body);font-style:italic;color:var(--fg-muted);font-size:14px;line-height:1.5;max-width:260px;">Paper, canvas, and moody washes — apply at 8–20% opacity to warm sections or as full-bleed hero backings.</div>
</div></body></html>
