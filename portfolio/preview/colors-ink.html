<!doctype html>
<html><head><meta charset="utf-8"><title>Card</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:var(--paper-1);}
  .card{padding:22px 26px;display:flex;gap:24px;align-items:center;min-height:110px;}
  .swatch{width:110px;height:110px;flex:none;border:1px solid var(--border-soft);background:var(--ink-2);}
  .list{flex:1;display:grid;grid-template-columns:repeat(5,1fr);gap:8px;}
  .chip{display:flex;flex-direction:column;gap:6px;}
  .chip .c{height:40px;border:1px solid var(--border-soft);}
  .chip .n{font-family:var(--font-ui);font-size:10px;letter-spacing:.08em;color:var(--fg-muted);text-transform:uppercase;}
  .chip .v{font-family:var(--font-ui);font-size:10px;color:var(--fg-subtle);}
</style></head>
<body><div class="card">
  <div class="swatch"></div>
  <div class="list">
    <div class="chip"><div class="c" style="background:var(--ink-1)"></div><div class="n">ink-1</div><div class="v">#1a1612</div></div>
    <div class="chip"><div class="c" style="background:var(--ink-2)"></div><div class="n">ink-2</div><div class="v">#3a2f25</div></div>
    <div class="chip"><div class="c" style="background:var(--ink-3)"></div><div class="n">ink-3</div><div class="v">#6b5b4a</div></div>
    <div class="chip"><div class="c" style="background:var(--ink-4)"></div><div class="n">ink-4</div><div class="v">#9c8d7a</div></div>
    <div class="chip"><div class="c" style="background:var(--ink-5)"></div><div class="n">ink-5</div><div class="v">#bfb29e</div></div>
  </div>
</div></body></html>
