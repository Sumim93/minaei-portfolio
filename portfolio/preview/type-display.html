<!doctype html>
<html><head><meta charset="utf-8"><title>Card</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,300..600,0..100&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<style>html,body{margin:0;padding:0;background:var(--paper-1);}
.card{padding:26px 30px;}
.hero{font-family:var(--font-display);font-size:84px;line-height:1;font-weight:300;letter-spacing:-0.035em;color:var(--ink-1);font-variation-settings:"SOFT" 100,"opsz" 144;}
.hero i{font-style:italic;}
.meta{display:flex;gap:18px;margin-top:18px;font-family:var(--font-ui);font-size:10px;letter-spacing:.2em;color:var(--fg-muted);text-transform:uppercase;}
</style></head>
<body><div class="card">
  <div class="hero">In quiet <i>light</i>.</div>
  <div class="meta"><span>Fraunces · Display</span><span>Light 300 · opsz 144 · SOFT 100</span><span>clamp 56–128px</span></div>
</div></body></html>
