<!doctype html>
<html><head><meta charset="utf-8"><title>Card</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,300..600,0..100&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<style>html,body{margin:0;padding:0;background:var(--paper-1);}
.card{padding:22px 30px;display:flex;flex-direction:column;gap:10px;}
.row{display:flex;align-items:baseline;gap:20px;border-bottom:1px solid var(--border-soft);padding-bottom:8px;}
.row:last-child{border:0;}
.label{font-family:var(--font-ui);font-size:10px;letter-spacing:.18em;color:var(--fg-muted);text-transform:uppercase;min-width:58px;}
.sp{font-family:var(--font-ui);font-size:10px;color:var(--fg-subtle);margin-left:auto;}
.s1{font-family:var(--font-display);font-size:48px;line-height:1.1;font-weight:300;letter-spacing:-0.02em;color:var(--ink-1);}
.s2{font-family:var(--font-display);font-size:32px;line-height:1.15;font-weight:400;color:var(--ink-1);}
.s3{font-family:var(--font-display);font-size:22px;font-style:italic;font-weight:400;color:var(--ink-1);}
</style></head>
<body><div class="card">
  <div class="row"><div class="label">H1</div><div class="s1">Statuary portraits</div><div class="sp">40–72 · Fraunces 300</div></div>
  <div class="row"><div class="label">H2</div><div class="s2">The October sittings</div><div class="sp">32–48 · Fraunces 400</div></div>
  <div class="row"><div class="label">H3 / i</div><div class="s3">Notes from the studio</div><div class="sp">22 · Italic 400</div></div>
</div></body></html>
