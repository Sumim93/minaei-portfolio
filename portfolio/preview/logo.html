<!doctype html>
<html><head><meta charset="utf-8"><title>Card</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..400&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<style>html,body{margin:0;padding:0;background:var(--paper-1);}
.card{padding:22px 26px;display:grid;grid-template-columns:120px 1fr;gap:20px;align-items:center;}
.mono{display:flex;align-items:center;justify-content:center;height:110px;}
.wm img{height:46px;display:block;}
.desc{font-family:var(--font-body);font-size:14px;font-style:italic;color:var(--fg-muted);line-height:1.5;max-width:360px;}
.l{font-family:var(--font-ui);font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--fg-muted);margin-bottom:8px;}
</style></head>
<body><div class="card">
  <div class="mono"><img src="../assets/logo/monogram.svg" alt="" style="height:92px"/></div>
  <div>
    <div class="l">Brand mark</div>
    <div class="wm"><img src="../assets/logo/wordmark.svg" alt=""/></div>
    <div class="desc" style="margin-top:14px">Monogram for favicons and tight corners. Wordmark everywhere else. Ornamental serif, italic <em>M</em>, thin ring — square corners, warm ink on paper.</div>
  </div>
</div></body></html>
