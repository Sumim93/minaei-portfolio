<!doctype html>
<html><head><meta charset="utf-8"><title>Card</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Caveat:wght@400;600&family=Fraunces:wght@400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<style>html,body{margin:0;padding:0;background:var(--paper-1);}
.card{padding:22px 30px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:26px;align-items:center;min-height:120px;}
.col{display:flex;flex-direction:column;gap:8px;}
.label{font-family:var(--font-ui);font-size:10px;letter-spacing:.2em;color:var(--fg-muted);text-transform:uppercase;}
.eyebrow{font-family:var(--font-ui);font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--fg-muted);font-weight:500;}
.caption{font-family:var(--font-body);font-size:13px;font-style:italic;color:var(--fg-muted);line-height:1.4;}
.sig{font-family:'Caveat',cursive;font-size:38px;color:var(--ink-2);line-height:1;}
.tag{font-family:var(--font-ui);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-2);border:1px solid var(--border);padding:4px 10px;display:inline-block;}
</style></head>
<body><div class="card">
  <div class="col">
    <div class="label">Eyebrow / Label</div>
    <div class="eyebrow">№ 04 · Portrait Studies</div>
    <div class="tag">Oil on linen</div>
  </div>
  <div class="col">
    <div class="label">Caption</div>
    <div class="caption">Bust with Veil, 2024. Oil on linen, 18 × 24 in.</div>
  </div>
  <div class="col">
    <div class="label">Signature · Caveat</div>
    <div class="sig">S. Minaci</div>
  </div>
</div></body></html>
