<!doctype html>
<html><head><meta charset="utf-8"><title>Card</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<style>html,body{margin:0;padding:0;background:var(--paper-1);}
.card{padding:22px 26px;display:grid;grid-template-columns:repeat(7,1fr);gap:22px;align-items:center;}
.it{display:flex;flex-direction:column;align-items:center;gap:10px;}
.ic{width:36px;height:36px;color:var(--ink-2);stroke:currentColor;fill:none;stroke-width:1.25;stroke-linecap:round;stroke-linejoin:round;}
.n{font-family:var(--font-ui);font-size:9.5px;letter-spacing:.18em;color:var(--fg-muted);text-transform:uppercase;}
</style></head>
<body><div class="card">
  <div class="it"><svg class="ic" viewBox="0 0 24 24"><path d="M5 5l14 14M19 5L5 19"/></svg><div class="n">Close</div></div>
  <div class="it"><svg class="ic" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg><div class="n">Prev</div></div>
  <div class="it"><svg class="ic" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg><div class="n">Next</div></div>
  <div class="it"><svg class="ic" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M16 16l5 5M8 11h6M11 8v6"/></svg><div class="n">Zoom</div></div>
  <div class="it"><svg class="ic" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg><div class="n">Menu</div></div>
  <div class="it"><svg class="ic" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="12" cy="12" r="4"/><circle cx="17" cy="7" r="0.6" fill="currentColor"/></svg><div class="n">IG</div></div>
  <div class="it"><svg class="ic" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14"/><path d="M3 6l9 7 9-7"/></svg><div class="n">Mail</div></div>
</div></body></html>
