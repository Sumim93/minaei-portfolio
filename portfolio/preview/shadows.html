<!doctype html>
<html><head><meta charset="utf-8"><title>Card</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<style>html,body{margin:0;padding:0;background:var(--paper-1);}
.card{padding:28px;display:flex;gap:28px;align-items:center;}
.item{display:flex;flex-direction:column;align-items:center;gap:10px;flex:1;}
.box{width:110px;height:70px;background:var(--paper-0);}
.s1{box-shadow:var(--shadow-1);}
.s2{box-shadow:var(--shadow-2);}
.s3{box-shadow:var(--shadow-3);}
.sf{box-shadow:var(--shadow-frame);}
.n{font-family:var(--font-ui);font-size:10px;letter-spacing:.18em;color:var(--fg-muted);text-transform:uppercase;}
</style></head>
<body><div class="card">
  <div class="item"><div class="box s1"></div><div class="n">shadow-1</div></div>
  <div class="item"><div class="box s2"></div><div class="n">shadow-2</div></div>
  <div class="item"><div class="box s3"></div><div class="n">shadow-3</div></div>
  <div class="item"><div class="box sf"></div><div class="n">frame</div></div>
</div></body></html>
