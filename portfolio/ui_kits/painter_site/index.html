<style>
  html, body { margin: 0; padding: 0; background: var(--paper-1); color: var(--ink-1); }
  #root { min-height: 100vh; }
  button { font: inherit; }
  /* variant switcher */
  .variant-switcher {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: rgba(20,17,13,0.92); color: var(--dark-on-1);
    padding: 8px; border-radius: 999px; display: flex; gap: 4px;
    z-index: 50; backdrop-filter: blur(14px);
    font-family: var(--font-ui); font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase;
    box-shadow: 0 20px 40px rgba(0,0,0,0.25);
  }
  .variant-switcher button {
    background: transparent; border: 0; color: inherit; padding: 10px 16px;
    border-radius: 999px; cursor: pointer; letter-spacing: inherit; font: inherit;
    text-transform: inherit;
  }
  .variant-switcher button.active { background: var(--paper-0); color: var(--ink-1); }
</style>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>

<script type="text/babel" src="components/Header.jsx"></script>
<script type="text/babel" src="components/Footer.jsx"></script>

<script type="text/babel" src="Gallery.jsx"></script>

<script type="text/babel" src="Contact.jsx"></script>

<script type="text/babel" data-presets="react">
  // Series.jsx is exported from Contact.jsx bundle; it's on window already.

  function PageFade({ pageKey, children }) {
    const [visible, setVisible] = React.useState(false);
    React.useEffect(() => {
      const t = requestAnimationFrame(() => setVisible(true));
      return () => cancelAnimationFrame(t);
    }, [pageKey]);
    return (
      <div style={{ opacity: visible ? 1 : 0, transition: "opacity 0.35s ease" }}>
        {children}
      </div>
    );
  }

  function App() {
    const [route, setRoute] = React.useState({ page: "home", params: null });

    const navigate = (page, params) => {
      setRoute({ page, params });
      window.scrollTo({ top: 0, behavior: "instant" });
    };

    const page = route.page;
    const navKey = page === "home" ? "" :
      page === "works" ? "works" :
      page === "painting" ? "works" :
      page === "series" ? "series" :
      page === "about" ? "about" :
      page === "contact" ? "contact" : "";

    const isMonographHero = page === "home";

    return (
      <div>
        <div style={{
          position: isMonographHero ? "absolute" : "relative",
          top: 0, left: 0, right: 0, zIndex: 5,
        }}>
          <Header
            current={navKey}
            onNavigate={navigate}
            variant={isMonographHero ? "dark" : "light"}
          />
        </div>

        <PageFade pageKey={page}>
          {page === "home" && <Home onNavigate={navigate} />}
          {page === "works" && <Gallery onNavigate={navigate} />}
          {page === "painting" && <PaintingDetail painting={route.params} onNavigate={navigate} />}
          {page === "about" && <About />}
          {page === "series" && <Series onNavigate={navigate} />}
          {page === "contact" && <Contact prefill={route.params} />}
        </PageFade>

        <Footer onNavigate={navigate} />
      </div>
    );
  }

  const root = ReactDOM.createRoot(document.getElementById("root"));
  root.render(<App/>);
</script>
</body>
