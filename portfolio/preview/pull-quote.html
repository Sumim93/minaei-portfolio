<!doctype html>
<html><head><meta charset="utf-8"><title>Card</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;1,300&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<style>html,body{margin:0;padding:0;background:var(--paper-1);}
.card{padding:22px 26px;display:flex;flex-direction:column;gap:12px;}
.pull{font-family:'Cormorant Garamond','Fraunces',serif;font-size:22px;line-height:1.4;font-style:italic;font-weight:300;color:var(--ink-1);border-left:0;padding:0;margin:0;max-width:600px;}
.pull::before{content:"“";font-size:48px;line-height:0;vertical-align:-0.25em;color:var(--pigment-sienna);margin-right:.12em;}
.attr{font-family:var(--font-ui);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--fg-muted);}
.divider{text-align:center;color:var(--fg-subtle);letter-spacing:1.2em;font-size:11px;margin:4px 0;}
</style></head>
<body><div class="card">
  <div class="divider">·   ·   ·</div>
  <p class="pull">I paint to look more slowly. A portrait, for me, is just permission to keep looking at someone until they soften.</p>
  <div class="attr">— from the October studio notes</div>
</div></body></html>
