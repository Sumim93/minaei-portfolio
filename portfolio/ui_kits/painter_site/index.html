<style>
  html, body { margin: 0; padding: 0; background: var(--paper-1); color: var(--ink-1); }
  #root { min-height: 100vh; }
  button { font: inherit; }
  /* variant switcher */
  .variant-switcher {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: rgba(20,17,13,0.92); color: var(--dark-on-1);
    padding: 8px; border-radius: 999px; display: flex; gap: 4px;
    z-index: 50; backdrop-filter: blur(14px);
    font-family: var(--font-ui); font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase;
    box-shadow: 0 20px 40px rgba(0,0,0,0.25);
  }
  .variant-switcher button {
    background: transparent; border: 0; color: inherit; padding: 10px 16px;
    border-radius: 999px; cursor: pointer; letter-spacing: inherit; font: inherit;
    text-transform: inherit;
  }
  .variant-switcher button.active { background: var(--paper-0); color: var(--ink-1); }
</style>

<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script src="components/data.js"></script>
<script src="components/utils.js"></script>
<script type="text/babel" src="components/Icon.jsx"></script>
<script type="text/babel" src="components/Button.jsx"></script>
<script type="text/babel" src="components/Frame.jsx"></script>
<script type="text/babel" src="components/Header.jsx"></script>
<script type="text/babel" src="components/Footer.jsx"></script>
<script type="text/babel" src="Home.jsx"></script>
<script type="text/babel" src="Gallery.jsx"></script>
<script type="text/babel" src="PaintingDetail.jsx"></script>
<script type="text/babel" src="About.jsx"></script>
<script type="text/babel" src="Contact.jsx"></script>

<script type="text/babel" data-presets="react">
  // Series.jsx is exported from Contact.jsx bundle; it's on window already.

  // ── Sticky nav that slides in from top after scrolling 80 px ──────────────
  function StickyNav({ current, onNavigate }) {
    const { isMobile } = useBreakpoint();
    const [scrolled, setScrolled] = React.useState(false);
    const [menuOpen, setMenuOpen] = React.useState(false);

    React.useEffect(() => {
      const onScroll = () => setScrolled(window.scrollY > 80);
      window.addEventListener("scroll", onScroll, { passive: true });
      return () => window.removeEventListener("scroll", onScroll);
    }, []);

    // Close mobile menu when page changes
    React.useEffect(() => { setMenuOpen(false); }, [current]);

    const items = [
      { key: "works",   label: "Works" },
      { key: "series",  label: "Series" },
      { key: "about",   label: "About" },
      { key: "contact", label: "Contact" },
    ];

    const go = (key) => { onNavigate(key); setMenuOpen(false); };

    return (
      <div style={{
        position: "fixed", top: 0, left: 0, right: 0, zIndex: 200,
        transform: scrolled ? "translateY(0)" : "translateY(-110%)",
        transition: "transform 0.38s cubic-bezier(0.2,0.8,0.2,1)",
        background: "rgba(245,241,234,0.96)",
        backdropFilter: "blur(18px)",
        WebkitBackdropFilter: "blur(18px)",
        borderBottom: "1px solid var(--border-soft)",
        boxShadow: scrolled ? "0 4px 24px rgba(60,45,30,0.08)" : "none",
      }}>
        <div style={{
          padding: isMobile ? "14px 20px" : "16px 48px",
          display: "flex", alignItems: "center", justifyContent: "space-between",
          color: "var(--ink-1)",
        }}>
          {/* Logo */}
          <a href="/" onClick={e => { e.preventDefault(); go("home"); }} style={{
            fontFamily: "var(--font-display)", fontSize: 26, fontWeight: 300,
            letterSpacing: "-0.02em", color: "inherit", textDecoration: "none",
            fontVariationSettings: '"opsz" 144, "SOFT" 100',
          }}>Sumim</a>

          {/* Desktop links */}
          {!isMobile && (
            <nav style={{ display: "flex", gap: 32 }}>
              {items.map(it => (
                <a key={it.key} href={`/${it.key}`}
                  onClick={e => { e.preventDefault(); go(it.key); }}
                  style={{
                    fontFamily: "var(--font-ui)", fontSize: 11, letterSpacing: "0.22em",
                    textTransform: "uppercase", color: "inherit", textDecoration: "none",
                    opacity: current === it.key ? 1 : 0.6,
                    paddingBottom: 4,
                    borderBottom: current === it.key ? "1px solid var(--ink-1)" : "1px solid transparent",
                    transition: "opacity 0.2s ease",
                  }}>
                  {it.label}
                </a>
              ))}
            </nav>
          )}

          {/* Desktop CTA */}
          {!isMobile && (
            <a href="/contact" onClick={e => { e.preventDefault(); go("contact"); }} style={{
              fontFamily: "var(--font-ui)", fontSize: 11, letterSpacing: "0.22em",
              textTransform: "uppercase", color: "inherit", textDecoration: "none",
              border: "1px solid currentColor", padding: "7px 16px",
              borderRadius: 999, opacity: 0.8,
              transition: "opacity 0.2s ease",
            }}
            onMouseEnter={e => e.currentTarget.style.opacity = 1}
            onMouseLeave={e => e.currentTarget.style.opacity = 0.8}
            >Send a Note</a>
          )}

          {/* Mobile hamburger */}
          {isMobile && (
            <button onClick={() => setMenuOpen(o => !o)} style={{
              background: "transparent", border: 0, cursor: "pointer",
              color: "inherit", padding: 4, lineHeight: 1, fontSize: 22,
            }}>
              {menuOpen ? "✕" : "☰"}
            </button>
          )}
        </div>

        {/* Mobile dropdown */}
        {isMobile && menuOpen && (
          <div style={{
            borderTop: "1px solid var(--border-soft)",
            background: "rgba(245,241,234,0.98)",
          }}>
            {items.map(it => (
              <a key={it.key} href={`/${it.key}`}
                onClick={e => { e.preventDefault(); go(it.key); }}
                style={{
                  display: "block", fontFamily: "var(--font-ui)", fontSize: 11,
                  letterSpacing: "0.22em", textTransform: "uppercase",
                  color: "var(--ink-1)", textDecoration: "none",
                  padding: "16px 20px", borderBottom: "1px solid var(--border-soft)",
                  opacity: current === it.key ? 1 : 0.7,
                }}>
                {it.label}
              </a>
            ))}
          </div>
        )}
      </div>
    );
  }

  function PageFade({ pageKey, children }) {
    const [visible, setVisible] = React.useState(false);
    React.useEffect(() => {
      const t = requestAnimationFrame(() => setVisible(true));
      return () => cancelAnimationFrame(t);
    }, [pageKey]);
    return (
      <div style={{ opacity: visible ? 1 : 0, transition: "opacity 0.35s ease" }}>
        {children}
      </div>
    );
  }

  // Read route from URL pathname (e.g. /works, /about, /painting/candle-veil)
  function routeFromPath() {
    const path = window.location.pathname.replace(/\/$/, "") || "/";
    if (path === "/" || path === "") return { page: "home", params: null };
    if (path.startsWith("/painting/")) {
      const slug = path.slice("/painting/".length);
      const painting = (window.PAINTINGS || []).find(p => p.slug === slug) || null;
      return { page: "painting", params: painting };
    }
    const known = ["works", "about", "series", "contact"];
    const seg = path.slice(1); // strip leading /
    if (known.includes(seg)) return { page: seg, params: null };
    return { page: "home", params: null };
  }

  function App() {
    const [route, setRoute] = React.useState(routeFromPath);

    const navigate = (page, params) => {
      // Build real path
      let path = page === "home" ? "/" : "/" + page;
      if (page === "painting" && params) path = "/painting/" + params.slug;
      // Push a real browser history entry so Back works
      window.history.pushState({ page, params }, "", path);
      setRoute({ page, params });
      window.scrollTo({ top: 0, behavior: "instant" });
    };

    // Handle browser Back / Forward buttons
    React.useEffect(() => {
      const onPop = (e) => {
        const r = e.state ? e.state : routeFromPath();
        setRoute(r);
        window.scrollTo({ top: 0, behavior: "instant" });
      };
      window.addEventListener("popstate", onPop);
      // Stamp the initial history entry so Back from page 1 works correctly
      window.history.replaceState(route, "", window.location.href);
      return () => window.removeEventListener("popstate", onPop);
    }, []);

    const page = route.page;
    const navKey = page === "home" ? "" :
      page === "works" ? "works" :
      page === "painting" ? "works" :
      page === "series" ? "series" :
      page === "about" ? "about" :
      page === "contact" ? "contact" : "";

    const isMonographHero = page === "home";

    return (
      <div>
        {/* Sticky nav — slides in from top after 80 px of scroll */}
        <StickyNav current={navKey} onNavigate={navigate} />

        {/* Page-top header (transparent, overlaid on hero or page top) */}
        <div style={{
          position: isMonographHero ? "absolute" : "relative",
          top: 0, left: 0, right: 0, zIndex: 5,
        }}>
          <Header
            current={navKey}
            onNavigate={navigate}
            variant={isMonographHero ? "dark" : "light"}
          />
        </div>

        <PageFade pageKey={page}>
          {page === "home" && <Home onNavigate={navigate} />}
          {page === "works" && <Gallery onNavigate={navigate} />}
          {page === "painting" && <PaintingDetail painting={route.params} onNavigate={navigate} />}
          {page === "about" && <About />}
          {page === "series" && <Series onNavigate={navigate} />}
          {page === "contact" && <Contact prefill={route.params} />}
        </PageFade>

        <Footer onNavigate={navigate} />
      </div>
    );
  }

  const root = ReactDOM.createRoot(document.getElementById("root"));
  root.render(<App/>);
</script>
</body>
