<!doctype html>
<html><head><meta charset="utf-8"><title>Card</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..600&family=Cormorant+Garamond:ital,wght@0,400;1,300;1,400&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<style>html,body{margin:0;padding:0;background:var(--paper-1);}
.card{padding:22px 30px;display:flex;gap:28px;}
.col{flex:1;}
.label{font-family:var(--font-ui);font-size:10px;letter-spacing:.2em;color:var(--fg-muted);text-transform:uppercase;margin-bottom:8px;}
.lead{font-family:'Cormorant Garamond',serif;font-size:20px;line-height:1.45;font-style:italic;font-weight:300;color:var(--ink-2);margin:0;}
.body{font-family:var(--font-body);font-size:15px;line-height:1.55;color:var(--ink-2);margin:0;}
</style></head>
<body><div class="card">
  <div class="col">
    <div class="label">Lead · Cormorant Italic</div>
    <p class="lead">I paint to look more slowly — oils, built in glazes across long sittings.</p>
  </div>
  <div class="col">
    <div class="label">Body · Fraunces 400</div>
    <p class="body">The underpainting is cold, almost blue. Flesh tones are built up in warm glazes over three or four sittings; the whites come last and only where the light catches.</p>
  </div>
</div></body></html>
